name: Actualizar descargas oficiales

on:
  push:
    branches:
      - agent/descargas-oficiales
    paths:
      - .github/workflows/update-downloads.yml

permissions:
  contents: write

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/descargas-oficiales

      - name: Reemplazar tarjetas de descargas
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          start = html.index('      <div class="descargas">', html.index('<section id="descargas">'))
          end = html.index('      </div>\n    </div>\n  </section>', start) + len('      </div>')

          nuevo = '''      <div class="descargas">
        <div class="descarga reveal">
          <span class="tag">2026</span>
          <h4>Calendario Escolar 2026</h4>
          <p>Calendario oficial de la Provincia de Buenos Aires, aprobado por la RESOC-2025-6568-GDEBA-DGCYE.</p>
          <a href="https://www.gba.gob.ar/transporte/boleto_estudiantil" target="_blank" rel="noopener noreferrer">Ver calendario oficial</a>
        </div>

        <div class="descarga reveal">
          <span class="tag">PDF</span>
          <h4>Régimen Académico de la Escuela Secundaria</h4>
          <p>Resolución 1650/24. Incluye ingreso y matriculación, asistencia, evaluación, acreditación, convivencia y el marco específico para Educación Técnica y Agraria.</p>
          <a href="https://abc.gob.ar/secretarias/sites/default/files/2024-06/RSC-2024-20025654-GDEBA-DGCYE.pdf" target="_blank" rel="noopener noreferrer">Abrir resolución</a>
        </div>

        <div class="descarga reveal">
          <span class="tag">PDF</span>
          <h4>Guía explicativa del Régimen Académico</h4>
          <p>Material de apoyo de DGCyE sobre cuatrimestres, intensificación, acreditación, materias pendientes, matriculación y trayectorias educativas.</p>
          <a href="https://storage.dtelab.com.ar/uploads/2025/03/Informe-ES-MAS.pdf" target="_blank" rel="noopener noreferrer">Ver guía</a>
        </div>

        <div class="descarga reveal">
          <span class="tag">GUÍA</span>
          <h4>GPS del Régimen Académico para estudiantes</h4>
          <p>Guía para estudiantes sobre asistencia, organización del ciclo lectivo, calificación, aprobación, acreditación, ingreso, permanencia y egreso.</p>
          <a href="https://storage.dtelab.com.ar/uploads/2025/03/GPS-_02-1.pdf" target="_blank" rel="noopener noreferrer">Ver guía oficial</a>
        </div>
      </div>'''

          html = html[:start] + nuevo + html[end:]
          path.write_text(html, encoding='utf-8')

      - name: Commit y push
        run: |
          git config user.name "ChatGPT Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Actualizar sección de descargas" || exit 0
          git push origin HEAD:agent/descargas-oficiales
