name: Agregar correo de inscripciones

on:
  push:
    branches:
      - agent/agregar-correo-inscripciones
    paths:
      - .github/workflows/add-inscription-email.yml

permissions:
  contents: write

jobs:
  update-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/agregar-correo-inscripciones

      - name: Agregar correo de inscripciones
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'Correo de inscripciones: <a href="mailto:inscripcion2025eestn6@gmail.com">' not in html:
              html = html.replace(
                  '<li>Mail oficial: tecnica6avellaneda@abc.gob.ar</li>',
                  '<li>Mail oficial: tecnica6avellaneda@abc.gob.ar</li>\n            <li>Correo de inscripciones: <a href="mailto:inscripcion2025eestn6@gmail.com">inscripcion2025eestn6@gmail.com</a></li>',
                  1,
              )

          if '<strong>Correo de inscripciones</strong>' not in html:
              marker = '<a href="mailto:tecnica6avellaneda@abc.gob.ar" id="mail-oficial">tecnica6avellaneda@abc.gob.ar</a>\n          </div>'
              replacement = marker + '\n\n          <div class="item-contacto">\n            <strong>Correo de inscripciones</strong>\n            <a href="mailto:inscripcion2025eestn6@gmail.com">inscripcion2025eestn6@gmail.com</a>\n          </div>'
              html = html.replace(marker, replacement, 1)

          if 'Inscripciones: <a href="mailto:inscripcion2025eestn6@gmail.com">' not in html:
              html = html.replace(
                  '<p>Email: tecnica6avellaneda@abc.gob.ar</p>',
                  '<p>Email: tecnica6avellaneda@abc.gob.ar</p>\n        <p>Inscripciones: <a href="mailto:inscripcion2025eestn6@gmail.com">inscripcion2025eestn6@gmail.com</a></p>',
                  1,
              )

          path.write_text(html, encoding="utf-8")

      - name: Commit y push
        run: |
          if git diff --quiet -- index.html; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "ChatGPT Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Completar correo de inscripciones"
          git push origin HEAD:agent/agregar-correo-inscripciones
